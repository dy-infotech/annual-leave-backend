spring:
  application:
    name: annual-leave-backend

  config:
    import: "optional:file:.env[.properties]" # .env file load

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver # mysql -> oracle

  jpa:
   hibernate:
    ddl-auto: validate
   show-sql: false         # ⚠️ 파일 로그에도 기록하기 위해 false로 두고 아래 logging에서 제어합니다.
   properties:
    hibernate:
     format_sql: false     # 운영시 포맷팅 불필요. 용량 차지 저하.
     highlight_sql: false  # sql 키워드 색상은 콘솔상 필요조건. 파일에선 불필요한 낭비.

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
     mail:
       smtp:
         auth: true
         connectiontimeout: 5000
         timeout: 5000
         writetimeout: 5000 
         starttls:
           enable: true
           required: true
           ssl:
             protocols: TLSv1 TLSv1.1 TLSv1.2 TLSv1.3
    
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_TIMEOUT:900000}   # 공통 SSO access JWT 기본 15분

openapi:
  service-key: ${SERVICE_KEY}

# API 문서는 운영에서 기본 비활성화한다.
# 개발/사내망에서 명시적으로 필요할 때만 SPRINGDOC_ENABLED=true로 연다.
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

fcm:
  certification: ${FIREBASE_CREDENTIAL_PATH:classpath:firebase-service-account.json}

app:
  auth:
    refresh-idle-ttl: ${AUTH_REFRESH_IDLE_TTL:7d}
    refresh-absolute-ttl: ${AUTH_REFRESH_ABSOLUTE_TTL:30d}
    refresh-replay-grace: ${AUTH_REFRESH_REPLAY_GRACE:5s}
    refresh-session-retention: ${AUTH_REFRESH_SESSION_RETENTION:7d}
    refresh-token-bytes: ${AUTH_REFRESH_TOKEN_BYTES:32}
    refresh-signing-secret: ${AUTH_REFRESH_SIGNING_SECRET:${jwt.secret}}
    refresh-cookie-name: ${AUTH_REFRESH_COOKIE_NAME:DY_SSO_REFRESH}
    refresh-cookie-path: ${AUTH_REFRESH_COOKIE_PATH:/}
    refresh-cookie-secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    refresh-cookie-same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Strict}
    # 공유 AUTH_REFRESH_SESSION 정리의 기본 소유자는 resource-management.
    # annual-leave가 정리를 대신 수행해야 하는 환경에서만 cron을 명시한다.
    refresh-cleanup-cron: ${AUTH_REFRESH_CLEANUP_CRON:-}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://app.dyinfotech.com}

logging:
  level:
    root: info
    org.springframework.boot.autoconfigure: error  # Condition Evaluation Report log  disable
    org.hibernate.SQL: info                        # disable sql log (use p6spy)
    org.hibernate.orm.jdbc.bind: info              # disable sql parameter log (use p6spy)

    com.dyinfotech.annualleavebackend: info       # @Slf4j log level
  
  pattern:
    console: "%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %replace(%m | clientIp=%X{clientIp}){' \\| clientIp=$',''}%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p ${PID:- } --- [%15.15t] %-40.40logger{39} : %replace(%m | clientIp=%X{clientIp}){' \\| clientIp=$',''}%n"

  file:
   name: logs/local-app.log

  # 파일 로테이션 설정 (서버 용량 방어)
  logback:
    rollingpolicy:
      file-name-pattern: "logs/local-app.%d{yyyy-MM-dd}.%i.log.gz"
      max-file-size: 1MB
      max-history: 30
      total-size-cap: 35MB
      clean-history-on-start: true

# p6spy
decorator:
  datasource:
    p6spy:
      enable-logging: true