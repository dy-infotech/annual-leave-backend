name: Develop Full Test

on:
  push:
    branches:
      - develop_v1.0
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run full test suite
        run: |
          chmod +x gradlew
          ./gradlew test
