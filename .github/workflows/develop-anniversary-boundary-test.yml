name: Develop Build Check

on:
  push:
    branches:
      - develop_v1.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify compile and packaging
        run: |
          chmod +x gradlew
          ./gradlew testClasses bootJar -x test
