name: Spring Boot Backend CI/CD

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. SSH 접속 테스트 (Fail-Fast)
      - name: 1. 서버 접속 테스트
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "SSH 접속 및 키 인증 성공!"

      # 2. Repository Checkout
      - name: 2. 소스코드 체크아웃
        uses: actions/checkout@v4

      # 3. Java & Gradle Cache
      - name: 3. JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 4. Build
      - name: 4. Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test

      # 5. 서버 배포 디렉터리 준비
      - name: 5. 서버 배포 디렉터리 준비
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            mkdir -p /opt/annual-leave/target
            rm -f /opt/annual-leave/target/*

      # 6. JAR 업로드
      - name: 6. Build JAR Upload
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "build/libs/*.jar"
          target: "/opt/annual-leave/target/"
          strip_components: 2

      # 7. 배포 및 서비스 재시작
      - name: 7. Deploy & Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            # plain.jar 제거
            rm -f /opt/annual-leave/target/*plain.jar

            # 업로드된 JAR 확인
            JAR_FILE=$(find /opt/annual-leave/target -maxdepth 1 -name "*.jar" | head -n 1)

            if [ -z "$JAR_FILE" ]; then
              echo "ERROR: 업로드된 JAR 파일이 없습니다."
              exit 1
            fi

            # 기존 JAR 백업
            if [ -f /opt/annual-leave/app.jar ]; then
              cp /opt/annual-leave/app.jar /opt/annual-leave/app.jar.bak
            fi

            # 새 버전 배포
            mv "$JAR_FILE" /opt/annual-leave/app.jar

            # 임시 파일 정리
            rm -rf /opt/annual-leave/target/*

            # 서비스 재시작
            sudo -n systemctl restart annual-leave.service

            # 기동 대기
            sleep 5

            # 서비스 상태 확인
            if ! sudo -n systemctl is-active --quiet annual-leave.service; then
              echo "===== 서비스 실행 실패 ====="
              sudo -n journalctl -u annual-leave.service -n 50 --no-pager
              exit 1
            fi

            echo "배포 완료!"