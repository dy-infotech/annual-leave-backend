name: Spring Boot Backend CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: 2. JDK 21 설정 & Gradle 캐시
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 3. Gradle 빌드 (JAR 생성)
      run: |
        chmod +x gradlew
        ./gradlew bootJar -x test

    - name: 4. SSH 키 파일 생성 및 서버 배포
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_PORT: ${{ secrets.SERVER_PORT }}
      run: |
        # 1) SSH 키 포맷 깨짐 방지를 위해 cat << EOF 방식 사용 (가장 안전한 파일 쓰기)
        mkdir -p ~/.ssh
        cat << 'EOF' > ~/.ssh/deploy_key
        ${{ secrets.SSH_PRIVATE_KEY }}
        EOF
        chmod 600 ~/.ssh/deploy_key

        PORT=${SERVER_PORT:-22}
        
        # 공통 명령어 변수화 (명령어 가독성 및 재사용성 확보)
        SSH_CMD="ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -p $PORT"
        SCP_CMD="scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key -P $PORT"

        # 2) 원격 서버 임시 폴더 생성
        $SSH_CMD ${SERVER_USER}@${SERVER_HOST} "mkdir -p /opt/annual-leave/target"

        # 3) 빌드된 JAR 파일 전송
        $SCP_CMD build/libs/*.jar ${SERVER_USER}@${SERVER_HOST}:/opt/annual-leave/target/

        # 4) plain.jar 제거, app.jar 교체, 서비스 재시작
        $SSH_CMD ${SERVER_USER}@${SERVER_HOST} "rm -f /opt/annual-leave/target/*plain.jar && \
                  mv /opt/annual-leave/target/*.jar /opt/annual-leave/app.jar && \
                  rm -rf /opt/annual-leave/target && \
                  sudo systemctl restart annual-leave.service"