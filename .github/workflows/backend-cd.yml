name: Spring Boot Backend CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: 2. JDK 21 설정 & Gradle 캐시
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 3. Gradle 빌드 (JAR 생성)
      run: |
        chmod +x gradlew
        ./gradlew bootJar -x test

    - name: 4. SSH Agent 설정
      uses: webfactory/ssh-agent@v0.8.1
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: 5. 파일 전송 및 서비스 재시작
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_PORT: ${{ secrets.SERVER_PORT }}
      run: |
        PORT=${SERVER_PORT:-22}
        SSH_CMD="ssh -o StrictHostKeyChecking=no -p $PORT ${SERVER_USER}@${SERVER_HOST}"
        SCP_CMD="scp -o StrictHostKeyChecking=no -P $PORT"

        # 1) 원격 서버 임시 폴더 생성
        $SSH_CMD "mkdir -p /opt/annual-leave/target"

        # 2) 빌드된 JAR 전송
        $SCP_CMD build/libs/*.jar ${SERVER_USER}@${SERVER_HOST}:/opt/annual-leave/target/

        # 3) plain.jar 제거, app.jar 교체, 서비스 재시작 실행
        $SSH_CMD "rm -f /opt/annual-leave/target/*plain.jar && \
                  mv /opt/annual-leave/target/*.jar /opt/annual-leave/app.jar && \
                  rm -rf /opt/annual-leave/target && \
                  sudo systemctl restart annual-leave.service"