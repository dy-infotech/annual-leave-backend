name: Spring Boot Backend CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 소스코드 체크아웃
      uses: actions/checkout@v4

    - name: 2. JDK 21 설정 & Gradle 캐시 적용
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: 3. Gradle 빌드 (JAR 생성)
      run: |
        chmod +x gradlew
        ./gradlew bootJar -x test

    - name: 4. 빌드된 JAR 파일 서버로 전송 (SCP)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        source: "build/libs/*.jar"
        target: "/opt/annual-leave/target/" # 임시 폴더로 먼저 전송
        strip_components: 2

    - name: 5. JAR 교체 및 서비스 재시작 (SSH)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # plain.jar 제외 및 기존 app.jar 교체 후 재시작
          rm -f /opt/annual-leave/target/*plain.jar
          mv /opt/annual-leave/target/*.jar /opt/annual-leave/app.jar
          rm -rf /opt/annual-leave/target
          sudo systemctl restart annual-leave.service