name: Spring Boot Backend CI/CD

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. SSH 접속 테스트 (Fail Fast)
      - name: 1. SSH 접속 테스트
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "===== SSH 연결 성공 ====="
            whoami


      # 2. Checkout
      - name: 2. 소스코드 체크아웃
        uses: actions/checkout@v7


      # 3. JDK 설정
      - name: 3. JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      # 4. Gradle Build
      - name: 4. Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test


      # 5. 서버 배포 디렉터리 준비
      - name: 5. 서버 배포 디렉터리 준비
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            APP_DIR=/opt/annual-leave
            TARGET_DIR=$APP_DIR/target

            echo "===== 배포 디렉터리 준비 ====="

            mkdir -p "$TARGET_DIR"
            rm -f "$TARGET_DIR"/*

            echo "준비 완료"


      # 6. JAR 업로드
      - name: 6. Build JAR Upload
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "build/libs/*.jar"
          target: "/opt/annual-leave/target/"
          strip_components: 2


      # 7. 배포 및 재시작
      - name: 7. Deploy & Restart
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e

            APP_DIR=/opt/annual-leave
            TARGET_DIR=$APP_DIR/target
            APP_JAR=$APP_DIR/app.jar
            BACKUP_JAR=$APP_JAR.bak


            # 서비스 기동 확인 함수
            wait_for_service() {
              for i in {1..6}
              do
                STATUS=$(sudo -n /usr/bin/systemctl is-active annual-leave.service || true)

                echo "CHECK $i : $STATUS"

                if [ "$STATUS" = "active" ]; then
                  return 0
                fi

                sleep 5
              done

              return 1
            }


            echo "===== JAR 확인 ====="

            JAR_FILE=$(find "$TARGET_DIR" \
              -maxdepth 1 \
              -name "*.jar" \
              ! -name "*plain.jar" \
              | head -n 1)


            if [ -z "$JAR_FILE" ]; then
              echo "ERROR: 배포할 JAR 파일이 없습니다."
              exit 1
            fi


            echo "===== 기존 JAR 백업 ====="

            if [ -f "$APP_JAR" ]; then
              cp "$APP_JAR" "$BACKUP_JAR"
            fi


            echo "===== 신규 JAR 적용 ====="

            mv "$JAR_FILE" "$APP_JAR"


            echo "===== 임시 파일 정리 ====="

            rm -rf "$TARGET_DIR"/*


            echo "===== 서비스 재시작 ====="

            sudo -n /usr/bin/systemctl restart annual-leave.service


            echo "===== 신규 버전 기동 확인 ====="

            if wait_for_service; then

              echo "===== 배포 완료 ====="
              exit 0

            fi


            echo "===== 신규 버전 실행 실패 ====="

            sudo -n /usr/bin/systemctl status annual-leave.service --no-pager || true


            echo "===== 롤백 시작 ====="

            if [ ! -f "$BACKUP_JAR" ]; then
              echo "백업 파일이 없어 롤백 불가"
              exit 1
            fi

            cp "$BACKUP_JAR" "$APP_JAR"


            echo "===== 이전 버전 재시작 ====="

            sudo -n /usr/bin/systemctl restart annual-leave.service


            echo "===== 롤백 기동 확인 ====="

            if wait_for_service; then
              echo "===== 롤백 성공 ====="
            else
              echo "===== 롤백 실패 ====="
              sudo -n /usr/bin/systemctl status annual-leave.service --no-pager || true
              exit 1
            fi