name: Spring Boot Backend CI

on:
  push:
    branches:
      - develop_v1.0
      - develop_v2.0
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: oracle-test-system
          APP_USER: annual_leave_test
          APP_USER_PASSWORD: annual_leave_test
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: 1. 소스코드 체크아웃
        uses: actions/checkout@v7

      - name: 2. JDK 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: 3. Oracle 21c XE 테스트 스키마 준비
        run: |
          set -e
          ORACLE_ID=$(docker ps --filter "ancestor=gvenzl/oracle-xe:21-slim-faststart" --format "{{.ID}}" | head -n 1)
          test -n "$ORACLE_ID"

          docker cp sql/schema.sql "$ORACLE_ID:/tmp/schema.sql"
          docker cp sql/data.sql "$ORACLE_ID:/tmp/data.sql"

          # fresh CI DB에는 공통 인증 tablespace가 없으므로 app schema보다 먼저 준비한다.
          # 운영의 dba_prepare_common_auth_tablespace.sql은 HR_USER 대상이므로,
          # CI에서는 annual_leave_test에 직접 quota를 부여한다.
          docker exec "$ORACLE_ID" bash -lc '
            sqlplus -s "sys/oracle-test-system@//localhost:1521/XEPDB1 as sysdba" <<SQL
          WHENEVER SQLERROR EXIT SQL.SQLCODE ROLLBACK;
          CREATE TABLESPACE COMMON_DATA
              DATAFILE '"'"'/opt/oracle/oradata/XE/XEPDB1/COMMON_DATA01.dbf'"'"' SIZE 32M
              AUTOEXTEND ON NEXT 16M MAXSIZE UNLIMITED
              EXTENT MANAGEMENT LOCAL
              SEGMENT SPACE MANAGEMENT AUTO;
          CREATE TABLESPACE COMMON_INDEX
              DATAFILE '"'"'/opt/oracle/oradata/XE/XEPDB1/COMMON_INDEX01.dbf'"'"' SIZE 16M
              AUTOEXTEND ON NEXT 8M MAXSIZE UNLIMITED
              EXTENT MANAGEMENT LOCAL
              SEGMENT SPACE MANAGEMENT AUTO;
          ALTER USER annual_leave_test QUOTA UNLIMITED ON COMMON_DATA;
          ALTER USER annual_leave_test QUOTA UNLIMITED ON COMMON_INDEX;
          EXIT;
          SQL
          '

          docker exec "$ORACLE_ID" bash -lc \
            "sqlplus -s annual_leave_test/annual_leave_test@//localhost:1521/XEPDB1 @/tmp/schema.sql"
          docker exec "$ORACLE_ID" bash -lc \
            "sqlplus -s annual_leave_test/annual_leave_test@//localhost:1521/XEPDB1 @/tmp/data.sql"

      - name: 4. Gradle Build
        env:
          RUN_ORACLE_INTEGRATION_TESTS: "true"
          TEST_DB_URL: jdbc:oracle:thin:@localhost:1521/XEPDB1
          TEST_DB_USERNAME: annual_leave_test
          TEST_DB_PASSWORD: annual_leave_test
        run: |
          chmod +x gradlew
          ./gradlew test bootJar
