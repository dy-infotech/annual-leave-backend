plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7' 
    id 'io.spring.dependency-management' version '1.1.7'
    id 'war'
}

group = 'com.dyinfotech'
version = '0.0.1-SNAPSHOT'
description = 'annual-leave-backend'


//java {
//    toolchain {
//    	// Cafe24 maximum jdk version is 17
//        languageVersion = JavaLanguageVersion.of(17)
//    }
//}

// make JDK 21 and 25 compatible with JDK 17.
compileJava.options.release = 17

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    // Jackson Databind (ObjectMapper)
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    
    // included Tomcat to external Tomcat(Cafe24)
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    
    // Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.4.0'
    
    // Caffeine Cache
    implementation 'com.github.ben-manes.caffeine:caffeine'
}

tasks.withType(JavaCompile) {
    options.compilerArgs.add("-parameters")
}

tasks.named('test') {
    useJUnitPlatform()
}

bootWar {
    archiveFileName = 'ROOT.war'
}
