plugins {
    //id 'org.springframework.boot' version '4.0.7' 
    //id 'io.spring.dependency-management' version '1.1.7'
    id 'org.springframework.boot' version '3.0.12' 
    id 'io.spring.dependency-management' version '1.1.4'
    id 'java'
    id 'war'
}

group = 'com.dyinfotech'
version = '0.0.1-SNAPSHOT'
description = 'annual-leave-backend'


java {
    toolchain {
    	// Cafe24 maximum jdk version is 17
        languageVersion = JavaLanguageVersion.of(17)
    }
}

java {
	sourceCompatibility = '17'
	targetCompatibility = '17'
}
compileJava.options.release = 17

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    //implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // webmvc -> web (because of spring boot 4.x.x to 3.0.12)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // WebClient (alternative RestClient because of spring boot 4.x.x to 3.0.12)
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    // Jackson Databind (ObjectMapper)
    implementation 'org.springframework.boot:spring-boot-starter-json'
    //implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'
    // because of spring boot 4.x.x to 3.0.12
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
    
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    //testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    //testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    //testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    //testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // all of test (because of spring boot 4.x.x to 3.0.12)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    
    // included Tomcat to external Tomcat(Cafe24)
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    
    // Firebase Admin SDK
    implementation 'com.google.firebase:firebase-admin:9.4.0'
    
    // Caffeine Cache
    implementation 'com.github.ben-manes.caffeine:caffeine'
}

tasks.withType(JavaCompile) {
    options.release = 17
}

tasks.named('test') {
    useJUnitPlatform()
}

bootWar {
    archiveFileName = 'ROOT.war'
}
